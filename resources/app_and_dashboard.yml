# App + dashboard resources for the accelerator.
resources:
  apps:
    nbo_recommender:
      name: ${var.app_name}
      description: "Real-time Next-Best-Offer demo with a live sub-300ms latency meter."
      source_code_path: ../apps/recommender-app
      resources:
        - name: sql-warehouse
          description: "SQL warehouse for reading offers/customers and latency_results."
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          description: "Part 1 online-lookup ranking model endpoint."
          serving_endpoint:
            name: ${var.ranker_online_endpoint}
            permission: CAN_QUERY

  dashboards:
    nbo_dashboard:
      display_name: "NBO Feature Views Accelerator"
      file_path: ../dashboards/nbo_dashboard.json
      warehouse_id: ${var.dashboard_warehouse_id}
      # The dashboard JSON uses BARE table names (no catalog/schema); these fields supply the
      # default catalog + schema for every dataset. This is how the dashboard is parametrized
      # per deploy — a Lakeview dataset query cannot take a bundle var inline, but the resource's
      # dataset_catalog/dataset_schema can. The `schema` var defaults to the per-user, deploy-time
      # nbo_${workspace.current_user.short_name} — the SAME schema the notebooks target — so this
      # resolves to a real per-user schema (not empty) on a plain deploy. --var schema=<name> pins
      # a shared schema for both the dashboard and the notebooks together.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
