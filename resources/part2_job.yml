# Part 2 — Real-Time Streaming Recommender. Adds streaming in-session features (MSK) feeding
# the SAME ranker from Part 1 — now re-logged to consume the live cust_clicks_10m feature.
# No Vector Search: personalization lives entirely in the ranker (rank-all the offer catalog).
# Assumes Part 1 has run (reuses its catalog, features, online store).
resources:
  jobs:
    nbo_part2_realtime_streaming:
      name: "[NBO] Part 2 · Real-Time Streaming Recommender"
      tasks:
        # ORDER MATTERS: the managed ingestion pipeline created by create_stream (07) reads from
        # the LATEST Kafka offset, so the stream must exist and be RUNNING *before* any events are
        # produced. 07 therefore runs FIRST and blocks until its ingestion pipeline is RUNNING;
        # only then does the producer (08) feed events that the pipeline will actually capture.
        - task_key: streaming_feature_views
          notebook_task:
            notebook_path: ../notebooks/part2_realtime_two_stage/07_streaming_feature_views.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              kafka_connection: ${var.kafka_connection}
              topic: ${var.kafka_topic}
              online_store_name: ${var.online_store_name}
              allow_streaming_online: ${var.allow_streaming_online}

        - task_key: kafka_producer
          depends_on: [{ task_key: streaming_feature_views }]
          # bounded burst, produced AFTER 07 has confirmed the ingestion pipeline is RUNNING.
          # A bounded burst into a live pipeline is captured and materialized to the online store
          # (this is the proven recipe from the working reference notebook). Do NOT use continuous
          # here: a continuous producer never terminates, so realtime_serving would never run, and
          # because 08's awaitTermination() is commented out the task would instead exit and kill the
          # stream. Use mode=continuous only for the live-demo notebook path, not this job DAG.
          notebook_task:
            notebook_path: ../notebooks/part2_realtime_two_stage/08_kafka_topic_and_producer.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              kafka_connection: ${var.kafka_connection}
              service_credential: ${var.service_credential}
              topic: ${var.kafka_topic}
              mode: bounded
              allow_streaming_online: ${var.allow_streaming_online}

        - task_key: realtime_serving
          depends_on: [{ task_key: kafka_producer }]
          notebook_task:
            notebook_path: ../notebooks/part2_realtime_two_stage/09_realtime_serving.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ranker_endpoint: ${var.ranker_realtime_endpoint}
              allow_streaming_online: ${var.allow_streaming_online}

        - task_key: latency_and_freshness
          depends_on: [{ task_key: realtime_serving }]
          notebook_task:
            notebook_path: ../notebooks/benchmark/feature_freshness_benchmark.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ranker_endpoint: ${var.ranker_realtime_endpoint}
              kafka_connection: ${var.kafka_connection}
              service_credential: ${var.service_credential}
              topic: ${var.kafka_topic}
              allow_streaming_online: ${var.allow_streaming_online}
