bundle:
  name: nbo-recommender-ui

# The build artifacts are gitignored (built locally by `npm run build`), but the
# Apps runtime runs the prebuilt dist/ (it does not build) — force them into the
# deploy. node_modules is excluded explicitly (707MB); the Apps container installs
# runtime deps from package.json/.npmrc (omit=dev) itself.
sync:
  exclude:
    - node_modules
    - tests
    - playwright-report
    - test-results
    - .smoke-test
    - '*.log'
  include:
    - dist/**
    - client/dist/**

variables:
  app_name:
    description: Databricks App name. Override per user/workspace to avoid a name collision.
    default: nbo-recommender-ui
  sql_warehouse_id:
    description: SQL Warehouse ID for the assistant's run_sql tool (pass --var sql_warehouse_id=<id>)
  query_sp_scope:
    description: >-
      Secret scope holding the query service principal creds (keys sp_client_id / sp_client_secret).
      Route-optimized endpoints require a downscoped OAuth token that the app's own SP cannot mint,
      so the app uses this SP (which must have CAN_QUERY on the ranker endpoint) — same SP the feature-serving & feature-freshness benchmarks use.
    default: nbo

resources:
  apps:
    app:
      name: ${var.app_name}
      description: 'Real-time Next-Best-Offer recommender + in-app AI assistant'
      source_code_path: ./
      # sql: run_sql executes as the signed-in user (UC access per user).
      # serving.serving-endpoints: query the route-optimized ranker + call the assistant LLM.
      user_api_scopes:
        - sql
        - serving.serving-endpoints
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        # Query SP creds for route-optimized endpoint access (see query_sp_scope). Injected at
        # runtime from the secret scope; the deploy grants the app SP READ on these secrets.
        - name: query-sp-client-id
          secret:
            scope: ${var.query_sp_scope}
            key: sp_client_id
            permission: READ
        - name: query-sp-client-secret
          secret:
            scope: ${var.query_sp_scope}
            key: sp_client_secret
            permission: READ

targets:
  # Host comes from the CLI profile (-p <profile>) — nothing workspace-specific is committed.
  # A git-ignored ./deploy.local.sh holds a real profile + warehouse id + app name (see README).
  dev:
    mode: development
    default: true
