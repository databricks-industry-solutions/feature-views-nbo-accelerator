# Databricks Asset Bundle for the FSI Next-Best-Offer accelerator.
#
# Deploy (host comes from your CLI profile / DATABRICKS_HOST — nothing workspace-specific is
# committed here):
#   databricks bundle deploy -t dev -p <your-profile> --var warehouse_id=<sql-warehouse-id>
#
# Override any variable at deploy time with repeated --var flags, e.g.:
#   --var catalog=my_catalog --var schema=nbo --var warehouse_id=abc123
# A local, git-ignored ./deploy.local.sh can hold your real profile + warehouse id (see README).
bundle:
  name: feature-views-nbo-accelerator

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog (standard storage — required for streaming Feature Views)
    default: fins_industry_solutions
  schema:
    description: >-
      Schema for all accelerator assets. Leave BLANK to auto-derive a per-user schema
      nbo_<username> in every notebook (recommended for a shared catalog). Pin one shared
      schema across a job DAG with --var schema=<name>. Note: a job running as a service
      principal derives nbo_<sp-name> when blank.
    default: ""
  online_store_name:
    description: Lakebase online store name (DNS-compliant — lowercase, no underscores). Keep it a simple single word so the streaming FS sink emits an unquoted Postgres target. Batch and streaming features must share this one store (multi-store lookup is unsupported and breaks route-optimized serving).
    default: nbo
  warehouse_id:
    description: SQL warehouse id for the app and dashboard (required — pass with --var warehouse_id=<id>)
  kafka_connection:
    description: Existing Unity Catalog Kafka connection name (holds bootstrap servers)
    default: msk_kafka
  service_credential:
    description: UC service credential for MSK IAM auth (databricks.serviceCredential)
    default: msk_kafka
  kafka_topic:
    description: Kafka topic for in-session events
    default: nbo-session-events

targets:
  # Host is intentionally omitted from both targets so nothing workspace-specific is committed.
  # The CLI resolves the host from the profile you pass (-p <profile>) or DATABRICKS_HOST.
  dev:
    mode: development
    default: true

  prod:
    mode: production
